<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DOOM (1993) - Theta IDE</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #11111b;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #cdd6f4;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .fallback-card {
      text-align: center;
      padding: 24px;
      max-width: 500px;
      background: #1e1e2e;
      border: 1px solid #45475a;
      border-radius: 8px;
    }
    h2 { color: #f38ba8; margin-top: 0; }
    p { color: #a6adc8; font-size: 13px; line-height: 1.5; }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 16px;
      background: #89b4fa;
      color: #11111b;
      font-weight: 600;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <iframe id="doom-frame" src="https://dos.zone/player/?bundleUrl=https%3A%2F%2Fcdn.dos.zone%2Fcustom%2Fdos%2Fdoom.jsdos" allow="autoplay; fullscreen; keyboard"></iframe>
  </div>
</body>
</html>
