# Default configuration for ClinicalAlignmentPlotter (MIMIC-III)
# Evaluates policy agreement with clinicians and septic shock outcomes.
plots:
  - agreement_vs_shock

# Agreement metric configuration
# Options for agreement_metric: 'windowed_jaccard' (recommended), 'jaccard', 'accuracy'
agreement_metric: "windowed_jaccard"
window_hours: 3
empty_union_score: 1.0
use_cache: false

