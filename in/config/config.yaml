defaults:
  - agent: ppo/dnn
  - env: cartpole
  - mode: online
  - site: local
  - _self_

experiment_id: "default_exp"
experiment_name: "ungrouped/default_exp"
group: "ungrouped"
seed: 1
total_timesteps: 10000
intervals_count: 4
eval_episodes: 100
save_dataset: true
recover: false

# Pipeline Orchestration Flags
consolidate: null
partition: null
tensorboard: false
plot_style: null
no_plot: false
no_online: false
no_offline: false
dry_run: false
dash: false
dash_only: false
sweep: false
remake: false

# Default Slurm / Hardware Resources Schema
resources:
  partition: null
  cores: null
  memory: null
  time: null
  gpus: null
  nodes: null
  gpu_type: null

# Paths
results_dir: "results"
experiment_dir: "${results_dir}/experiments/${experiment_id}"
dataset_root: "in/datasets/${group}/${experiment_id}"
dataset_path: "${dataset_root}/${agent.name}/${hydra:job.num}"

# Redirect Hydra output and multirun directories inside results/hydra/
hydra:
  job:
    chdir: false
  run:
    dir: results/hydra/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: results/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
