# @package _global_
defaults:
- cew/_base
- override /env: cartpole

total_timesteps: 50000
eval_episodes: 20
intervals_count: 5

env:
  architecture: mlp
  rules: default

save_dataset: true
seed: 1
recover: false
methods:
  ppo_cp_tuned:
    agent: ppo
    model: dnn
  cql_blendrl_human_cew:
    agent: cql
    model: blendrl
  cql_blendrl_cew_only:
    agent: cql
    model: blendrl
  cql_blendrl_human_neural:
    agent: cql
    model: blendrl
