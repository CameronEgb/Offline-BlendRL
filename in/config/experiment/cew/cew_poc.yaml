# @package _global_
defaults:
- override /env: cartpole
- cew/_base

total_timesteps: 10000
eval_episodes: 20
intervals_count: 2

env:
  architecture: mlp
  rules: default

save_dataset: true
seed: 1
recover: false
methods:
  ppo_cp_tuned:
    agent: ppo
    model: dnn
    epochs_per_interval: 2
  cql_blendrl_human_cew:
    agent: cql
    model: blendrl
    epochs_per_interval: 2
  cql_blendrl_cew_only:
    agent: cql
    model: blendrl
    epochs_per_interval: 2
  cql_blendrl_human_neural:
    agent: cql
    model: blendrl
    epochs_per_interval: 2
