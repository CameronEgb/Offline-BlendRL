# @package _global_
defaults:
- cew/_base
- override /env: cartpole
env:
  name: cartpole
  architecture: mlp

# Offline methods and datasets

total_timesteps: 100000
intervals_count: 5
eval_episodes: 100

dataset_path: in/datasets/ungrouped/cp_final/ppo_cp_tuned

seed: 1
recover: false
methods:
  cew_base:
    agent: cew
    model: dnn
    epochs_per_interval: 100
    eval_interval_epochs: 10
    batch_size: 64
  cew_fyd:
    agent: cew
    model: dnn
    epochs_per_interval: 100
    eval_interval_epochs: 10
    batch_size: 64
