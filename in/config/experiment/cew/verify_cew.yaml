# @package _global_
defaults:
- cew/_base
env:
  name: cartpole
  architecture: mlp

# Use existing expert PPO data

total_timesteps: 100000
intervals_count: 1
eval_episodes: 100

dataset_path: in/datasets/ungrouped/cp_final/ppo_cp_tuned

methods:
  cew_dnn:
    agent: cew
    model: dnn
    epochs_per_interval: 200
    eval_interval_epochs: 10
    batch_size: 64
    lr: 3e-4
    cql_alpha: 0.1
    ecm_dthr: 0.1
    eps: 0.1
    kappa: 0.6
    fyd_top_k:
