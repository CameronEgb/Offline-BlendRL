# @package _global_
defaults:
- cew/_base
- override /env: cartpole

total_timesteps: 250000
intervals_count: 10
eval_episodes: 100
trainer:
  limit_train_batches: 500

save_dataset: true
seed: 1
recover: false
methods:
  ppo_cp_tuned:
    agent: ppo
    model: dnn
    epochs_per_interval: 50
  cew_base:
    agent: cew
    model: dnn
    epochs_per_interval: 50
  cew_fyd:
    agent: cew
    model: dnn
    epochs_per_interval: 50
