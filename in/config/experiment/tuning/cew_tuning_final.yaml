# @package _global_
defaults:
- tuning/_base
- override /env: cartpole
total_timesteps: 100000
intervals_count: 10
eval_episodes: 100
env:
  gamma: 0.99

recover: false
methods:
  cew_dnn:
    agent: cew
    model: dnn
    lr: 3e-4
    batch_size: 32
    epochs_per_interval: 100
    ecm_dthr: 0.1
    eps: 0.2
    kappa: 0.6
    cql_alpha: 1.0
  cew_fyd_dnn:
    agent: cew_fyd
    model: dnn
    lr: 3e-4
    batch_size: 32
    epochs_per_interval: 100
    ecm_dthr: 0.1
    eps: 0.2
    kappa: 0.6
    cql_alpha: 1.0
