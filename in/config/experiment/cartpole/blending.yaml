# @package _global_
defaults:
- cartpole/_base

total_timesteps: 100000
eval_episodes: 100
intervals_count: 10

env:
  rules: "default, variant1"
  architecture: mlp

methods:
  ppo_cp_tuned:
    agent: ppo
    model: dnn
  ppo_blendrl_multi_logic:
    agent: ppo
    model: blendrl
  iql_cp_tuned:
    agent: iql
    model: dnn
  iql_blendrl_multi_logic:
    agent: iql
    model: blendrl
