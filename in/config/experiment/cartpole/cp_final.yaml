# @package _global_
defaults:
  - cartpole/_base

total_timesteps: 100000
eval_episodes: 100
intervals_count: 10

methods:
  ppo_dnn:
    agent: ppo
    model: dnn
    lr: 0.003
    num_envs: 10
  ppo_blendrl:
    agent: ppo
    model: blendrl
    lr: 0.005
    logic_lr: 0.005
    blender_lr: 0.01
    ent_coef: 0.005
    blend_ent_coef: 0.005
  iql_dnn:
    agent: iql
    model: dnn
    lr: 0.0003
  iql_blendrl:
    agent: iql
    model: blendrl
    lr: 0.003
    logic_lr: 0.003
    blender_lr: 0.003

plots:
  convergence:
    smoothing_window: 10
  losses:
    metrics:
      - losses/actor_loss
      - losses/q_loss
  reports:
    include_hyperparameters: true
