# @package _global_
defaults:
- cartpole/_base
- override /hydra/sweeper: optuna_online

# Culminating Experiment for CartPole
total_timesteps: 100000
eval_episodes: 100
intervals_count: 10

# Phase 1: High-Performance Online Generation
hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: maximize
    storage: "sqlite:///results/optuna/optuna.db"
    study_name: "final_cp_${agent.name}"
    n_trials: 50
    n_jobs: 1
    params:
      # Tuning the Offline-specific Logic
      ++agent.tau: interval(0.5, 0.95)
      ++agent.beta: interval(1.0, 10.0)
      ++agent.lr: interval(1e-4, 5e-3)

      # Architecture exploration for multi_arch runs
      # (Placeholders allow these to be safely passed even if not used by all)
      ++agent.logic_lr: interval(1e-4, 5e-3)
      ++agent.blend_ent_coef: interval(0.0, 0.05)
methods:
  ppo_final_cp:
    agent: ppo
    model: dnn
  ppo_blendrl_final_cp:
    agent: ppo
    model: blendrl
  iql_cp_tuned:
    agent: iql
    model: dnn
  iql_blendrl_cp_tuned:
    agent: iql
    model: blendrl
  iql_blendrl_arch1:
    agent: iql
    model: blendrl
    '# TODO': variant-specific params needed
  iql_blendrl_arch2:
    agent: iql
    model: blendrl
    '# TODO': variant-specific params needed
  iql_blendrl_arch3:
    agent: iql
    model: blendrl
    '# TODO': variant-specific params needed
