# @package _global_
defaults:
- mimic/_base


methods:
  cql_dueling_resnet:
    agent: cql
    model: dueling_resnet
    epochs_per_interval: 25
    eval_interval_epochs: 5
    lr: 2e-4
    cql_alpha: 2.0
    reward_scale: 0.1
    bellman_loss: smooth_l1
    blend_ent_coef: 0.1
    ent_coef: 0.05
    weight_decay: 1e-4
  cql_blendrl_human_dueling_resnet_rigid:
    agent: cql
    model: blendrl
    epochs_per_interval: 25
    eval_interval_epochs: 5
