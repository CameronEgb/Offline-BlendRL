# @package _global_
defaults:
- mimic/_base

methods:
  cql_dnn:
    agent: cql
    model: dnn
    epochs_per_interval: 20
    eval_interval_epochs: 5
    cql_alpha: 2.0
    use_actor: false
    reward_scale: 0.1
  cql_dueling_resnet:
    agent: cql
    model: dueling_resnet
    epochs_per_interval: 20
    eval_interval_epochs: 5
    cql_alpha: 2.0
    use_actor: false
    reward_scale: 0.1
  cql_blendrl_human_dueling_resnet_rigid:
    agent: cql
    model: blendrl
    epochs_per_interval: 20
    eval_interval_epochs: 5
    cql_alpha: 2.0
    use_actor: false
    reward_scale: 0.1
