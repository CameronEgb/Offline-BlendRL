# @package _global_
defaults:
- mimic/_base
- override /site: ncshare

# Default partition: common (standard compute nodes)
# Dispatches parallel jobs across compute nodes
partition: common
consolidate: false

# Discrete CQL Comparison Benchmark: Pure Neural vs. Value-Based BlendRL
# All models train under identical discrete CQL Bellman + LogSumExp loss on Q-values.

env:
  gamma: 0.95

resources:
  partition: common
  cores: 16
  standalone_cores: 16
  memory: "32G"
  standalone_memory: "32G"
  time: "01:00:00"

methods:
  cql_dnn:
    agent: cql
    model: dnn
    epochs_per_interval: 25
    eval_interval_epochs: 2
    batch_size: 1024
    lr: 3e-4
    gamma: 0.95
    cql_alpha: 0.1
    reward_scale: 1.0
    pos_action_weight: 15.0
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_dueling_resnet:
    agent: cql
    model: dueling_resnet
    epochs_per_interval: 25
    eval_interval_epochs: 2
    batch_size: 1024
    lr: 3e-4
    gamma: 0.95
    cql_alpha: 0.1
    reward_scale: 1.0
    pos_action_weight: 15.0
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_blendrl_human_rigid:
    agent: cql
    model:
      name: blendrl
      symbolic:
        rules: rigid
    epochs_per_interval: 25
    eval_interval_epochs: 2
    batch_size: 1024
    lr: 3e-4
    gamma: 0.95
    cql_alpha: 0.1
    reward_scale: 1.0
    pos_action_weight: 15.0
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_blendrl_human_dueling_resnet_rigid:
    agent: cql
    model:
      name: blendrl
      neural:
        type: dueling_resnet
        hidden_sizes: [512, 512, 256, 128]
      symbolic:
        rules: rigid
    epochs_per_interval: 25
    eval_interval_epochs: 2
    batch_size: 1024
    lr: 3e-4
    gamma: 0.95
    cql_alpha: 0.1
    reward_scale: 1.0
    pos_action_weight: 15.0
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_blendrl_cew_dueling_resnet:
    agent: cql
    model:
      name: blendrl
      neural:
        type: dueling_resnet
        hidden_sizes: [512, 512, 256, 128]
      symbolic:
        type: cew
        ecm_dthr: 0.03
        fyd: false
    epochs_per_interval: 25
    eval_interval_epochs: 2
    batch_size: 1024
    lr: 3e-4
    gamma: 0.95
    cql_alpha: 0.1
    reward_scale: 1.0
    pos_action_weight: 15.0
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
