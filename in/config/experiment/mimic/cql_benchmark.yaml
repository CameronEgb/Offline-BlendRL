# @package _global_
defaults:
- mimic/_base
- override /site: ncshare

# Default partition: common (standard compute nodes)
# Dispatches parallel jobs across compute nodes
partition: common
consolidate: false

# Discrete CQL Comparison Benchmark: Pure Neural vs. Value-Based BlendRL
# All models train under identical discrete CQL Bellman + LogSumExp loss on Q-values.

resources:
  time: "08:00:00"
methods:
  cql_dnn:
    agent: cql
    model: dnn
    epochs_per_interval: 25
    eval_interval_epochs: 5
    batch_size: 1024
    lr: 2e-4
    cql_alpha: 2.0
    reward_scale: 0.1
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_dueling_resnet:
    agent: cql
    model: dueling_resnet
    epochs_per_interval: 25
    eval_interval_epochs: 5
    batch_size: 1024
    lr: 2e-4
    cql_alpha: 2.0
    reward_scale: 0.1
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_blendrl_human_rigid:
    agent: cql
    model: blendrl
    epochs_per_interval: 25
    eval_interval_epochs: 5
    batch_size: 1024
    lr: 2e-4
    cql_alpha: 2.0
    reward_scale: 0.1
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_blendrl_human_dueling_resnet_rigid:
    agent: cql
    model: blendrl
    epochs_per_interval: 25
    eval_interval_epochs: 5
    batch_size: 1024
    lr: 2e-4
    cql_alpha: 2.0
    reward_scale: 0.1
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
  cql_blendrl_cew_dueling_resnet:
    agent: cql
    model: blendrl
    epochs_per_interval: 25
    eval_interval_epochs: 5
    batch_size: 1024
    lr: 2e-4
    cql_alpha: 2.0
    reward_scale: 0.1
    bellman_loss: smooth_l1
    weight_decay: 1e-4
    use_actor: false
    blend_q_values: true
